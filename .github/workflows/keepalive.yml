# Keeps the Supabase "Camper" database awake.
# Supabase pauses free databases after about 7 days without enough activity.
# A read every 3 days was NOT enough (paused Oct 2026), so this job now
# WRITES a small timestamp row once a day. The row is named "keepalive:ping".
# The trailer log app ignores that row, so it never appears in trips or reports.
# It can also be run by hand from the Actions tab ("Run workflow").

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 12 * * *"      # every day at 12:00 UTC (8:00 AM Eastern)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write today's timestamp to the keepalive row
        run: |
          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOW_MS=$(date +%s000)
          curl --fail --silent --show-error -X POST \
            "https://wojzaavwrkttwxzydong.supabase.co/rest/v1/trailer_rows?on_conflict=id" \
            -H "apikey: sb_publishable_9_EUnkC32s8WkhTa5qHVbA_q2y3UWwH" \
            -H "Authorization: Bearer sb_publishable_9_EUnkC32s8WkhTa5qHVbA_q2y3UWwH" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d "{\"id\":\"keepalive:ping\",\"body\":{\"last_ping\":\"$NOW_ISO\"},\"ts\":$NOW_MS,\"deleted\":false}"
          echo "Supabase keepalive write OK at $NOW_ISO"
